<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KORA · Child AI Developmental Outcomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0e0c; --paper:#f7f4ef; --cream:#ede9e1; --rule:#c8c0b0;
  --accent:#F5B700; --muted:#8b8070; --white:#ffffff;
  --risk:#dc2626; --benefit:#059669;
  --fn:'DM Sans',sans-serif; --fm:'DM Mono',monospace; --fs:'DM Serif Display',serif;
}
html,body{width:100%;height:100%;background:var(--paper);color:var(--ink);font-family:var(--fn);overflow:hidden}

/* ── HEADER (KORA spec: logo + title + date only, centered) ── */
#hd{
  position:fixed;top:0;left:0;right:0;height:60px;
  background:var(--ink);z-index:200;
  display:flex;align-items:center;padding:0 28px;gap:0;
}
/* Logo left */
.hd-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hd-logo svg{width:28px;height:28px}
.hd-logo-text{font-family:var(--fn);font-size:17px;font-weight:700;color:var(--paper);letter-spacing:.04em;line-height:1}
/* Title center */
.hd-center{flex:1;text-align:center}
.hd-center h1{
  font-family:var(--fs);font-size:20px;font-weight:400;
  color:var(--paper);letter-spacing:0;line-height:1
}
.hd-center h1 em{color:var(--accent);font-style:italic}
/* Date right */
.hd-date{
  font-family:var(--fm);font-size:8px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(247,244,239,.3);flex-shrink:0
}

/* ── LAYOUT ── */
#viz{position:fixed;top:60px;left:0;right:380px;bottom:0;background:var(--paper)}
#panel{
  position:fixed;right:0;top:60px;width:380px;height:calc(100vh - 60px);
  background:var(--white);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;overflow:hidden
}

/* ── PANEL ── */
#ph{padding:20px 22px 16px;border-bottom:1px solid var(--rule);flex-shrink:0;display:none}
#pb{flex:1;overflow-y:auto;padding:16px 22px 24px}
#pb::-webkit-scrollbar{width:4px}
#pb::-webkit-scrollbar-thumb{background:var(--rule)}

.p-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px}
.p-empty-icon{font-size:28px;opacity:.18;color:var(--ink)}
.p-empty-title{font-family:var(--fs);font-size:18px;color:var(--muted)}
.p-empty-body{font-size:11px;color:var(--muted);line-height:1.7;max-width:240px}
.p-empty-tag{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--rule);margin-top:8px}

.ph-sec-label{font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ph-title{font-family:var(--fs);font-size:22px;font-weight:400;color:var(--ink);margin-bottom:2px;line-height:1.15}
.ph-sub{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:14px}

.bar-row{height:5px;border-radius:3px;overflow:hidden;display:flex;gap:1px;margin-bottom:3px}
.bar-risk{background:var(--risk);opacity:.6}
.bar-ben{background:var(--benefit);opacity:.6}
.bar-lbl{display:flex;justify-content:space-between;font-family:var(--fm);font-size:8px;letter-spacing:.05em;color:var(--muted)}

.stat-row{display:flex;gap:0;margin-top:14px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.stat-cell{flex:1;padding:10px 0;text-align:center;border-right:1px solid var(--rule)}
.stat-cell:last-child{border-right:none}
.stat-n{font-family:var(--fs);font-size:22px;color:var(--ink)}
.stat-l{font-family:var(--fm);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:1px}

.p-sec{font-family:var(--fm);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--cream)}
.mech-list{display:flex;flex-direction:column;gap:4px}
.mech-pill{padding:6px 10px;border-radius:2px;font-size:11px;line-height:1.45;border-left:3px solid}
.mech-pill.r{background:#fef2f2;border-color:var(--risk);color:#991b1b}
.mech-pill.b{background:#f0fdf4;border-color:var(--benefit);color:#065f46}
.st-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--cream)}
.st-item:last-child{border-bottom:none}
.st-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}
.st-text{font-size:10.5px;line-height:1.5;color:#3a3830}
.st-meta{font-family:var(--fm);font-size:8px;color:var(--muted);margin-top:2px}
.callout{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;padding:10px 12px;margin-top:14px;font-size:11px;color:#3a3830;line-height:1.6}
.callout strong{color:var(--ink)}
.gap-badge{display:inline-block;font-family:var(--fm);font-size:8px;letter-spacing:.08em;text-transform:uppercase;background:rgba(245,183,0,.15);color:#7a5c00;padding:3px 8px;border-radius:2px;margin-bottom:10px}
</style>
</head>

 "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}]}, {"id": "creative", "label": "Creative", "sublabel": "Divergent thinking, imagination, ideational fluency, originality", "color": "#9333ea", "n_studies": 15, "studies_pos": 1, "studies_neg": 0, "n_risks": 2, "n_benefits": 1, "top_risks": ["Displacement of Self-Generated Output — AI-generated content substitutes for children's own creative work", "Ideational Dependence — repeated AI prompting for ideas may atrophy divergent thinking"], "top_benefits": ["AI-Augmented Storytelling — LLM co-creation supports narrative imagination and ideational fluency (Xu Mathemyths 2024)"], "studies_sample": [{"id": "human-agency-and-creativity-ai-assisted-learning-environments", "label": "Human Agency And Creativity In AI-Assisted Learning Environments", "year": 2025, "effect_direction": "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}, {"id": "exploring-families-use-and-mediation-generative-ai-multi-user-perspective", "label": "Exploring Families' Use And Mediation Of Generative Ai: A Multi-User Perspective", "year": 2025, "effect_direction": "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}, {"id": "grillz-hijabi-intersectional-identities-fostering-critical-ai-literacy", "label": "\"Grillz on a hijabi\": Intersectional Identities in Fostering Critical AI Literacy", "year": 2025, "effect_direction": "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}, {"id": "musicscaffold-bridging-machine-efficiency-and-human-growth-adolescent-creative", "label": "MusicScaffold: Bridging Machine Efficiency and Human Growth in Adolescent Creative Ed", "year": 2025, "effect_direction": "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}, {"id": "designing-learning-generative-ai-wicked-problem-illustrative-longitudinal-qualitative", "label": "Designing for Learning with Generative AI is a Wicked Problem: An Illustrative Longit", "year": 2025, "effect_direction": "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}, {"id": "understanding-impacts-generative-ai-use-children", "label": "Understanding The Impacts Of Generative Ai Use On Children", "year": 2025, "effect_direction": "mixed", "evidence_strength": "MEDIUM", "causal_confidence": "MODERATE"}]}];

const W = window.innerWidth - 380;
const H = window.innerHeight - 60;
const cx = W / 2, cy = H / 2;
const N = 7;
const R_ORB = Math.min(W, H) * 0.315;

SPHERES.forEach((s, i) => {
  const ang = -Math.PI / 2 + (2 * Math.PI * i) / N;
  s.angle = ang;
  s.px = cx + R_ORB * Math.cos(ang);
  s.py = cy + R_ORB * Math.sin(ang);
});

const maxStudies = d3.max(SPHERES, d => d.n_studies);
const maxMechs   = d3.max(SPHERES, d => d.n_risks + d.n_benefits);

const svg = d3.select('#viz').append('svg').attr('width', W).attr('height', H);
// Cream paper background
svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#f7f4ef');

const g = svg.append('g');

// ── Heptagon spider grid (KORA rule lines) ──
[0.25, 0.5, 0.75, 1.0].forEach(frac => {
  const pts = SPHERES.map(s => [cx + R_ORB * frac * Math.cos(s.angle), cy + R_ORB * frac * Math.sin(s.angle)]);
  g.append('polygon')
    .attr('points', pts.map(p => p.join(',')).join(' '))
    .attr('fill', 'none')
    .attr('stroke', frac === 1.0 ? '#c8c0b0' : '#e0d9cf')
    .attr('stroke-width', frac === 1.0 ? 1.2 : 0.8);
});

// Spoke lines
SPHERES.forEach(s => {
  g.append('line')
    .attr('x1', cx).attr('y1', cy)
    .attr('x2', s.px).attr('y2', s.py)
    .attr('stroke', '#d8d0c6').attr('stroke-width', 0.8);
});

// ── Risk / benefit spider overlay ──
const maxM2 = maxMechs || 1;
const riskPoly = SPHERES.map(s => {
  const f = Math.max(0.08, s.n_risks / maxM2) * 0.88;
  return [cx + R_ORB * f * Math.cos(s.angle), cy + R_ORB * f * Math.sin(s.angle)];
});
g.append('polygon')
  .attr('points', riskPoly.map(p => p.join(',')).join(' '))
  .attr('fill', 'rgba(220,38,38,0.06)')
  .attr('stroke', 'rgba(220,38,38,0.2)')
  .attr('stroke-width', 1.2).attr('stroke-linejoin', 'round');

const benPoly = SPHERES.map(s => {
  const f = Math.max(0.04, s.n_benefits / maxM2) * 0.88;
  return [cx + R_ORB * f * Math.cos(s.angle), cy + R_ORB * f * Math.sin(s.angle)];
});
g.append('polygon')
  .attr('points', benPoly.map(p => p.join(',')).join(' '))
  .attr('fill', 'rgba(5,150,105,0.06)')
  .attr('stroke', 'rgba(5,150,105,0.2)')
  .attr('stroke-width', 1.2).attr('stroke-linejoin', 'round');

// ── Study dots ring ──
SPHERES.forEach(s => {
  const dotCount = Math.min(s.n_studies, 16);
  const dotR = 50;
  for (let j = 0; j < dotCount; j++) {
    const a = s.angle + (2 * Math.PI * j / dotCount);
    const st = s.studies_sample[j % (s.studies_sample.length || 1)];
    const col = st
      ? (st.effect_direction === 'positive' ? '#2563eb'
        : st.effect_direction === 'negative' ? '#dc2626' : '#c8c0b0')
      : '#c8c0b0';
    g.append('circle')
      .attr('cx', s.px + dotR * Math.cos(a))
      .attr('cy', s.py + dotR * Math.sin(a))
      .attr('r', 2.2).attr('fill', col).attr('opacity', 0.55);
  }
});

// ── Sphere nodes ──
const NODE_R = 36;
const AI = 42, AO = 55; // arc inner / outer radius

const nodeG = g.selectAll('.sph').data(SPHERES).join('g')
  .attr('class', 'sph')
  .attr('transform', d => `translate(${d.px},${d.py})`)
  .style('cursor', 'pointer');

// Outer arc ring: risks (red) + benefits (green)
nodeG.each(function(d) {
  const el = d3.select(this);
  const tot = d.n_risks + d.n_benefits || 1;
  const rf = d.n_risks / tot * Math.PI * 2;
  const bf = d.n_benefits / tot * Math.PI * 2;
  const arc = d3.arc().innerRadius(AI).outerRadius(AO).cornerRadius(2);
  if (d.n_risks > 0)
    el.append('path')
      .attr('d', arc({ startAngle: -Math.PI / 2, endAngle: -Math.PI / 2 + rf }))
      .attr('fill', 'rgba(220,38,38,0.15)').attr('stroke', 'rgba(220,38,38,0.45)').attr('stroke-width', 0.8);
  if (d.n_benefits > 0)
    el.append('path')
      .attr('d', arc({ startAngle: -Math.PI / 2 + rf, endAngle: -Math.PI / 2 + rf + bf }))
      .attr('fill', 'rgba(5,150,105,0.15)').attr('stroke', 'rgba(5,150,105,0.45)').attr('stroke-width', 0.8);
});

// Main circle — KORA card style: white fill, colored top border via stroke
nodeG.append('circle').attr('class', 'node-circle').attr('r', NODE_R)
  .attr('fill', '#ffffff')
  .attr('stroke', d => d.color).attr('stroke-width', 2).attr('stroke-opacity', 0.35)
  .attr('filter', 'drop-shadow(0 1px 4px rgba(15,14,12,.08))');

// Study volume inner ring (muted)
nodeG.append('circle')
  .attr('r', d => 7 + (d.n_studies / maxStudies) * 12)
  .attr('fill', 'none')
  .attr('stroke', d => d.color).attr('stroke-width', 1).attr('stroke-opacity', 0.18);

// Label text
nodeG.each(function(s) {
  const el = d3.select(this);
  const words = s.label.split(/[\s-]/);
  const lineH = 13;
  words.forEach((w, i) => {
    el.append('text')
      .attr('text-anchor', 'middle')
      .attr('dy', (i - (words.length - 1) / 2) * lineH + 3)
      .attr('font-family', "'DM Serif Display',serif")
      .attr('font-size', words.length > 2 ? 9 : 10.5)
      .attr('fill', '#0f0e0c')
      .text(w);
  });

  // n=X count below
  el.append('text')
    .attr('text-anchor', 'middle').attr('dy', NODE_R + 9)
    .attr('font-family', "'DM Mono',monospace").attr('font-size', 8)
    .attr('fill', '#8b8070').text(`n=${s.n_studies}`);

  // Risk / benefit count badges
  const yCnt = -NODE_R - 5;
  if (s.n_risks > 0)
    el.append('text').attr('x', -3).attr('y', yCnt).attr('text-anchor', 'end')
      .attr('font-family', "'DM Mono',monospace").attr('font-size', 8)
      .attr('fill', 'rgba(220,38,38,.7)').text(`▲${s.n_risks}`);
  if (s.n_benefits > 0)
    el.append('text').attr('x', 3).attr('y', yCnt).attr('text-anchor', 'start')
      .attr('font-family', "'DM Mono',monospace").attr('font-size', 8)
      .attr('fill', 'rgba(5,150,105,.7)').text(`▲${s.n_benefits}`);
});

// ── Center node ──
const cg = g.append('g').attr('transform', `translate(${cx},${cy})`);
cg.append('circle').attr('r', 36)
  .attr('fill', '#ffffff').attr('stroke', '#c8c0b0').attr('stroke-width', 1.2)
  .attr('filter', 'drop-shadow(0 1px 6px rgba(15,14,12,.1))');
cg.append('text').attr('text-anchor', 'middle').attr('dy', -9)
  .attr('font-family', "'DM Serif Display',serif").attr('font-size', 11).attr('fill', '#F5B700')
  .text('LLMs');
cg.append('text').attr('text-anchor', 'middle').attr('dy', 4)
  .attr('font-family', "'DM Sans',sans-serif").attr('font-size', 8).attr('fill', '#8b8070').text('&');
cg.append('text').attr('text-anchor', 'middle').attr('dy', 16)
  .attr('font-family', "'DM Serif Display',serif").attr('font-size', 10).attr('fill', '#3a3830')
  .text('Children');

// ── Legend bottom-left ──
const legData = [
  {col:'rgba(220,38,38,.5)', label:'Risk mechanisms'},
  {col:'rgba(5,150,105,.5)', label:'Benefit mechanisms'},
  {col:'#2563eb', label:'Positive effect'},
  {col:'#dc2626', label:'Negative effect'},
  {col:'#c8c0b0', label:'Mixed / nc'},
];
legData.forEach((l, i) => {
  const lg = svg.append('g').attr('transform', `translate(18,${H - 20 - (legData.length - 1 - i) * 16})`);
  lg.append('circle').attr('r', 4).attr('fill', l.col);
  lg.append('text').attr('x', 10).attr('dominant-baseline', 'middle')
    .attr('font-family', "'DM Mono',monospace").attr('font-size', 8).attr('letter-spacing', '.04em')
    .attr('fill', '#8b8070').text(l.label);
});

// ── Interactions ──
nodeG.on('mouseover', function() {
  if (!d3.select(this).classed('active'))
    d3.select(this).select('.node-circle')
      .transition().duration(120)
      .attr('stroke-opacity', .75).attr('stroke-width', 2.5);
}).on('mouseout', function() {
  if (!d3.select(this).classed('active'))
    d3.select(this).select('.node-circle')
      .transition().duration(120)
      .attr('stroke-opacity', .35).attr('stroke-width', 2);
}).on('click', function(e, d) {
  d3.selectAll('.sph').classed('active', false).select('.node-circle')
    .transition().duration(120).attr('stroke-opacity', .35).attr('stroke-width', 2);
  d3.select(this).classed('active', true).select('.node-circle')
    .transition().duration(120).attr('stroke-opacity', 1).attr('stroke-width', 3);
  showPanel(d);
});

function dirCol(d) { return d==='positive'?'#2563eb':d==='negative'?'#dc2626':'#8b8070' }
function dirLbl(d) { return d==='positive'?'↑ Positive':d==='negative'?'↓ Negative':'~ Mixed / n.c.' }

function showPanel(s) {
  const ph = document.getElementById('ph');
  const pb = document.getElementById('pb');
  ph.style.display = 'block';

  const tot = s.n_studies, pos = s.studies_pos, neg = s.studies_neg, mix = tot - pos - neg;
  const rm = s.n_risks + s.n_benefits || 1;
  const rw = ((s.n_risks / rm) * 100).toFixed(0);
  const bw = ((s.n_benefits / rm) * 100).toFixed(0);

  ph.innerHTML = `
    <div class="ph-sec-label" style="color:${s.color}">${s.id.replace('_',' ')} · Brio sphere</div>
    ${(s.id==='metacognitive'||s.id==='creative'||s.id==='sensorimotor') ? '<span class="gap-badge">Research gap</span>' : ''}
    <div class="ph-title">${s.label}</div>
    <div class="ph-sub">${s.sublabel}</div>
    ${rm > 1 ? `
      <div class="bar-row">
        <div class="bar-risk" style="width:${rw}%"></div>
        <div class="bar-ben" style="width:${bw}%"></div>
      </div>
      <div class="bar-lbl">
        <span style="color:rgba(220,38,38,.7)">${s.n_risks} risks (${rw}%)</span>
        <span style="color:rgba(5,150,105,.7)">${s.n_benefits} benefits (${bw}%)</span>
      </div>` : ''}
    <div class="stat-row">
      <div class="stat-cell"><div class="stat-n">${tot}</div><div class="stat-l">Studies</div></div>
      <div class="stat-cell"><div class="stat-n" style="color:#2563eb">${pos}</div><div class="stat-l">Positive</div></div>
      <div class="stat-cell"><div class="stat-n" style="color:#dc2626">${neg}</div><div class="stat-l">Negative</div></div>
      <div class="stat-cell"><div class="stat-n" style="color:#8b8070">${mix}</div><div class="stat-l">Mixed</div></div>
    </div>`;

  let html = '';

  if (s.id === 'academic') {
    html += `<div class="callout" style="margin-top:14px"><strong>Symptom sphere.</strong> In the Brio framework, academic outcomes are where difficulties become <em>visible</em>, while the other six spheres reveal the underlying <em>causes</em>.</div>`;
  }

  if (s.top_risks.length) {
    html += `<div class="p-sec">Risk mechanisms identified</div><div class="mech-list">
      ${s.top_risks.map(r => `<div class="mech-pill r">${r}</div>`).join('')}</div>`;
  }

  if (s.top_benefits.length) {
    html += `<div class="p-sec">Benefit mechanisms identified</div><div class="mech-list">
      ${s.top_benefits.map(b => `<div class="mech-pill b">${b}</div>`).join('')}</div>`;
  }

  if (s.studies_sample.length) {
    html += `<div class="p-sec">Studies (sample)</div>`;
    s.studies_sample.forEach(st => {
      html += `<div class="st-item">
        <div class="st-dot" style="background:${dirCol(st.effect_direction)}"></div>
        <div>
          <div class="st-text">${st.label}</div>
          <div class="st-meta">${dirLbl(st.effect_direction)} · Evidence: ${st.evidence_strength || '–'} · ${st.causal_confidence || '–'}</div>
        </div></div>`;
    });
  }

  if (s.id==='metacognitive'||s.id==='creative'||s.id==='sensorimotor') {
    html += `<div class="callout"><strong>Understudied domain.</strong> This sphere is under-represented in the LLM literature. The low study count (n=${s.n_studies}) is itself a finding: it signals a research gap, not an absence of effect.</div>`;
  }

  pb.innerHTML = html;
}
</script>
</body>
</html>
